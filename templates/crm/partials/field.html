{% load i18n %}
{# Renders one bound form field with its label, help text and errors. #}
<div>
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ field.label }}{% if field.field.required %}<span class="text-rose-500" aria-hidden="true"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="form-help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
</div>
